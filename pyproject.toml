[project]
name = "riskdesk"
version = "0.1.0"
description = "CrisisLens: a personal GenAI risk manager for an ordinary investor."
authors = [
    { name = "Charbel Nassar", email = "charbelpnassar@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.1",
    "gradio>=6.32.0",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
